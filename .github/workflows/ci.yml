name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Confirm there are no dependencies
        run: |
          test ! -f requirements.txt
          test ! -f pyproject.toml
          echo "no dependency manifests - stdlib only"

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

      - name: Audit the example schemas
        run: |
          python3 scripts/audit.py examples/blog-schema/before.sql --no-fix
          python3 scripts/audit.py examples/blog-schema/after.sql --strict

      - name: Render both outputs
        run: |
          python3 scripts/render.py examples/blog-schema/after.sql --mermaid
          python3 scripts/render.py examples/blog-schema/after.sql --out=/tmp/report.html
          test -s /tmp/report.html

      - name: Check the after schema is clean
        run: |
          count=$(python3 scripts/audit.py examples/blog-schema/after.sql --json \
                  | python3 -c "import json,sys; print(sum(json.load(sys.stdin)['counts'].values()))")
          echo "after.sql findings: $count"
          test "$count" = "0"
